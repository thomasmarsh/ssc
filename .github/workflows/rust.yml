name: Rust

on:
  push:
  pull_request:

jobs:
  headless-tests:
    name: Headless tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify stable meets the declared MSRV
        run: |
          rustc --version
          cargo --version
          rustc --version | grep -Eq '1\.(9[5-9]|[1-9][0-9]{2,})\.'
      - name: Test headless build
        run: cargo test --locked --no-default-features

  macos-check:
    name: Native desktop check (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify stable meets the declared MSRV
        run: |
          rustc --version
          cargo --version
          rustc --version | grep -Eq '1\.(9[5-9]|[1-9][0-9]{2,})\.'
      - name: Check native desktop build
        run: cargo check --locked
