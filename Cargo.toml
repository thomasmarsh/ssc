[package]
name = "ssc"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A physics arena shooter rebuilt with Rust, Bevy, and WGPU"
license = "GPL-2.0-only"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ssc"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std"] }

[features]
default = ["desktop"]
desktop = [
    "bevy/default_app", "bevy/bevy_winit", "bevy/multi_threaded",
    "bevy/2d_bevy_render", "bevy/ui_bevy_render", "bevy/default_font",
    "bevy/keyboard", "bevy/mouse", "bevy/bevy_gilrs", "bevy/bevy_audio", "bevy/wav", "bevy/x11", "bevy/wayland",
]

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# gilrs-core on macOS drops virtual HID gamepads that lack a LocationID (e.g. the Switch 2 bridge).
[patch.crates-io]
gilrs-core = { path = "vendor/gilrs-core" }
